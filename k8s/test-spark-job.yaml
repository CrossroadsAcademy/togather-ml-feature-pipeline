apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: batch-feature-job-test
  namespace: default
spec:
  type: Python
  sparkVersion: "3.5.3"
  pythonVersion: "3"
  mode: cluster
  image: togather-ml/spark-batch-pipeline:latest
  imagePullPolicy: IfNotPresent
  mainApplicationFile: "local:///opt/spark/work-dir/src/batch/batch_feature_job.py"
  arguments:
    - "--target-date"
    - "2026-01-12"
    - "--mode"
    - "incremental"
  sparkConf:
    spark.hadoop.fs.s3a.endpoint: "http://minio.platform.svc.cluster.local:9000"
    spark.hadoop.fs.s3a.path.style.access: "true"
    spark.hadoop.fs.s3a.impl: "org.apache.hadoop.fs.s3a.S3AFileSystem"
    spark.hadoop.fs.s3a.connection.ssl.enabled: "false"
    spark.hadoop.fs.s3a.aws.credentials.provider: "com.amazonaws.auth.EnvironmentVariableCredentialsProvider"
    spark.eventLog.enabled: "false"
  restartPolicy:
    type: OnFailure
    onFailureRetries: 2
  driver:
    cores: 1
    memory: "1g"
    serviceAccount: spark
    env:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: spark-s3-credentials
            key: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: spark-s3-credentials
            key: AWS_SECRET_ACCESS_KEY
      - name: REDIS_HOST
        value: "redis.platform.svc.cluster.local"
      - name: REDIS_PORT
        value: "6379"
      - name: REDIS_PASSWORD
        valueFrom:
          secretKeyRef:
            name: redis-secret
            key: REDIS_PASSWORD
  executor:
    cores: 1
    memory: "2g"
    instances: 1
