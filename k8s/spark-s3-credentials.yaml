---
# =============================================================================
# Spark S3 Credentials Secret
# =============================================================================
# Contains MinIO/S3 credentials for Spark jobs
# Used by SparkApplications to access MinIO buckets
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: spark-s3-credentials
  namespace: default
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "minioadmin"
  AWS_SECRET_ACCESS_KEY: "minioadmin123"
