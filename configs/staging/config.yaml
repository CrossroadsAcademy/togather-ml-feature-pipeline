app:
  name: togather-feature-pipeline
  env: staging
  debug: false

kafka:
  bootstrap_servers: kafka-staging:9092
  consumer_group: feature-pipeline-staging
  topics:
    user_events: user.events
    experience_events: experience.events
    interactions: user.interactions

redis:
  host: redis-staging
  port: 6379
  db: 0
  ttl: 86400

api:
  host: 0.0.0.0
  port: 8000
  reload: false

logging:
  level: INFO
  format: json
