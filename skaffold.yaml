apiVersion: skaffold/v4beta7
kind: Config
metadata:
  name: feature-pipeline

build:
  local:
    push: false
    # Enable BuildKit for better layer caching
    # If this hangs on Colima, set back to false
    useBuildkit: true
  tagPolicy:
    sha256: {}  # Use content-based SHA256 hash for consistent, reproducible tags
  artifacts:
    - image: togather-ml-feature-pipeline
      context: .
      docker:
        dockerfile: Dockerfile
    - image: togather-ml/flink-feature-job
      context: .
      docker:
        dockerfile: docker/Dockerfile.flink
    - image: togather-ml/spark-batch-pipeline
      context: .
      docker:
        dockerfile: docker/Dockerfile.spark
    # # App Events Processor - Kafka consumer that archives to MinIO
    # - image: togather-ml/app-events-processor
    #   context: .
    #   docker:
    #     dockerfile: docker/Dockerfile.consumer
manifests:
  rawYaml:
    - k8s/deployment.yaml
    - k8s/service.yaml
    - k8s/ingress.yaml
deploy:
  kubectl: {}
