name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install Poetry
              run: |
                  curl -sSL https://install.python-poetry.org | python3 -
                  echo "$HOME/.local/bin" >> $GITHUB_PATH

            - name: Install dependencies
              run: poetry install

            - name: Check formatting with Black
              run: poetry run black --check src tests

            - name: Lint with Ruff
              run: poetry run ruff check src tests

            - name: Type check with mypy
              run: poetry run mypy src

    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install system dependencies (Java + build tools)
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    openjdk-17-jdk-headless python3-dev gcc g++ make
                  export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which javac))))
                  echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
                  echo "$JAVA_HOME/lib/server" >> $GITHUB_PATH
                  echo "Installed Java at $JAVA_HOME"

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install Poetry
              run: |
                  curl -sSL https://install.python-poetry.org | python3 -
                  echo "$HOME/.local/bin" >> $GITHUB_PATH

            - name: Install dependencies
              run: poetry install

            - name: Run tests
              run: poetry run pytest --cov=src --cov-report=xml --cov-report=term

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v3
              with:
                  file: ./coverage.xml
                  fail_ci_if_error: false

    docker:
        name: Docker Build
        runs-on: ubuntu-latest
        needs: [lint, test]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Build Docker image
              run: docker build -t togather-ml/feature-pipeline:${{ github.sha }} .

            - name: Save image
              run: docker save togather-ml/feature-pipeline:${{ github.sha }} | gzip > image.tar.gz

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: docker-image
                  path: image.tar.gz
                  retention-days: 7
